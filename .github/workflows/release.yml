name: Release

# Pushing a `v*` tag builds Holt for Windows and Linux and publishes a GitHub release with both packages.
# Each package is portable: `holt` and `ask-agent` must stay in the same folder (Holt puts that folder on every
# agent's PATH), and the app keeps its `data/` next to them when the folder is writable.
#
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The release build would otherwise add the runner's binary to its app menu (crates/app/build.rs).
  HOLT_NO_DESKTOP_ENTRY: '1'

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "holt-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/holt.exe, target/release/ask-agent.exe, LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="holt-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$name"
          cp target/release/holt target/release/ask-agent LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: holt-${{ github.ref_name }}-${{ matrix.name }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "Holt ${{ github.ref_name }}" --generate-notes --latest
